name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SWIFT_DETERMINISTIC_HASHING: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report toolchain
        run: swift --version

      - name: Check formatting
        run: ./scripts/lint.sh

      - name: Build release
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Run tests
        run: ./scripts/test.sh
